# Traced siblings generated by torchgen for elementwise ops
# (torchgen/dest/ufunc.py, "HOST-TRACING SIBLINGS"): per entry a functor
# header HostTraceFunctor_<func>.cuh that the op's eager CUDA kernel host
# launches in place of its lambda and a fragment HostTraceSibling_<func>.cuh
# (the entry, its proxies and strided views) that the host's .cu includes at
# its end, so eager and the traced sibling instantiate the one kernel
# (DECISIONS E36); plus HostTraceSiblingOps.h / HostTraceSiblingBindings.h and
# the stubs through tools/pyi/gen_pyi.py. An op with a ufunc_inner_loop in
# native_functions.yaml (add) needs no entry here: its loops are read from
# there and its fragment goes into the generated UfuncCUDA_<func>.cu. For an
# op whose eager CUDA kernel host is hand-written, the entry names the
# functional overload and a ufunc header (default ATen/native/ufunc/<func>.h)
# with the kernel's device body, the only copy of it. The in-place, out= and
# .Scalar overloads of the op are served through the same entry. An op the
# registry serves through a hand entry (sin, cos, exp, rsqrt, neg, mul) has no
# entry here.
#
# Keys (torchgen/dest/ufunc.py SiblingSpec):
#   ufunc_inner_loop  native_functions.yaml's syntax; the dtype set is eager's
#                     dispatch macro; complex declines; bool only without fields
#   shape             eager (default): the functor over scalar_t launched as the
#                     eager host launches; ufunc: compute_ufunc_cuda's opmath
#                     functors (add, and any op whose eager lambda is opmath-typed)
#   symmetric         a CPU scalar on either side through the one-sided
#                     AUnaryFunctor (opmath_symmetric_gpu_kernel_with_scalars)
#   scalars           gpu_kernel_with_scalars; without either, a CPU scalar
#                     operand declines (eager's plain gpu_kernel asserts on one)
#   fields            non-tensor argument -> host conversion: opmath (default,
#                     eager's .to<opmath_t>()), scalar (.to<scalar_t>(), then
#                     widened), acc (.to<acc_type<scalar_t, true>>())
#   arg_types         tensor argument -> a fixed dtype (a bool mask)
#   variants          a str argument whose value picks the device body
#   inputs            the iterator's input order where eager's meta reorders
#   output            suggest_memory_format: eager allocates
#                     empty_like(self, suggest_memory_format()) itself
#   constants         member -> literal: a capture of eager's lambda that is not an
#                     argument (threshold_backward's value 0), converted as `fields` says
#   functor           a functor type eager's translation unit defines itself
#                     (AbsKernel.cu's AbsFunctor), launched as it is: no functor
#                     header, no ufunc header
#   host_args         arguments the registry's hand entry consumes (implies entry: hand)
#   entry             hand: a hand entry in torch/cuda/_host_trace_ti.py wraps the binding
- func: sigmoid
  ufunc_inner_loop:
    Generic: sigmoid (Floating, Half, BFloat16)
- func: maximum
  symmetric: true
  ufunc_inner_loop:
    Generic: maximum (All, Half, BFloat16, Bool)
- func: minimum
  symmetric: true
  ufunc_inner_loop:
    Generic: minimum (All, Half, BFloat16, Bool)
# AbsKernel.cu's AbsFunctor, defined in that translation unit
- func: abs
  functor: at::native::AbsFunctor<scalar_t>
  ufunc_inner_loop:
    Generic: abs (All, Half, BFloat16, Bool)
- func: log
  ufunc_inner_loop:
    Generic: log (Floating, Half, BFloat16)
- func: tanh_backward
  ufunc_inner_loop:
    Generic: tanh_backward (Floating, Half, BFloat16)
- func: sigmoid_backward
  ufunc_inner_loop:
    Generic: sigmoid_backward (Floating, Half, BFloat16)
# the reduction modes compose the kernel with mean / sum in the hand entry
- func: mse_loss
  host_args: [reduction]
  ufunc_inner_loop:
    Generic: mse_loss (Floating, Half, BFloat16)
- func: gelu_backward
  variants:
    approximate: [none, tanh]
  ufunc_inner_loop:
    Generic: gelu_backward (Floating, Half, BFloat16)
# Dropout.cu masked_scale_kernel: a bool mask beside the scalar_t gradient,
# the scale in acc_type; the hand entry keeps eager's mask dtype check
- func: native_dropout_backward
  entry: hand
  arg_types:
    mask: bool
  fields:
    scale: acc
  output: suggest_memory_format
  ufunc_inner_loop:
    Generic: native_dropout_backward (Floating, Half, BFloat16)
# Activation.cpp's meta orders the inputs (self, grad); threshold_kernel_impl
# captures the threshold and the value (0 for the backward) in scalar_t and
# launches through gpu_kernel_with_scalars (BinaryFunctor over the functor)
- func: threshold_backward
  scalars: true
  inputs: [self, grad_output]
  fields:
    threshold: scalar
    value: scalar
  constants:
    value: 0
  ufunc_inner_loop:
    Generic: threshold_backward (All, Half, BFloat16)
- func: leaky_relu
  ufunc_inner_loop:
    Generic: leaky_relu (Floating, Half, BFloat16)
- func: hardtanh_backward
  ufunc_inner_loop:
    Generic: hardtanh_backward (Floating, Half, BFloat16)
- func: addcmul
  fields:
    value: acc
  ufunc_inner_loop:
    Generic: addcmul (All, Half, BFloat16)
- func: lerp.Scalar
  header: ATen/native/ufunc/lerp.h
  ufunc_inner_loop:
    Generic: lerp (Floating, Half, BFloat16)
- func: lerp.Tensor
  header: ATen/native/ufunc/lerp.h
  ufunc_inner_loop:
    Generic: lerp (Floating, Half, BFloat16)
